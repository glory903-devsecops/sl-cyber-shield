<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>공지사항 - Spring Form</title>
	<link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<div class="page">
	<header class="header">
		<div class="logo">Spring Form</div>
		<nav class="nav">
			<a th:href="@{/}">홈</a>
			<a th:href="@{/notices}">공지사항</a>
		</nav>
		<div class="auth">
			<div th:if="${loginUser != null}" class="user">안녕하세요, <span th:text="${loginUser.displayName}">사용자</span></div>
			<form th:if="${loginUser != null}" th:action="@{/logout}" method="post">
				<button class="btn" type="submit">로그아웃</button>
			</form>
			<div th:if="${loginUser == null}" class="auth-links">
				<a class="btn" th:href="@{/login}">로그인</a>
				<a class="btn btn-outline" th:href="@{/signup}">회원가입</a>
			</div>
		</div>
	</header>

	<main class="content">
		<section class="card">
			<h1>공지사항</h1>
			<p class="muted">최신 공지사항을 확인하세요.</p>
			<table class="table">
				<thead>
				<tr>
					<th>제목</th>
					<th>작성일</th>
				</tr>
				</thead>
				<tbody>
				<tr th:each="notice : ${notices}">
					<td><a th:href="@{/notices/{id}(id=${notice.id})}" th:text="${notice.title}">제목</a></td>
					<td th:text="${#temporals.format(notice.createdAt, 'yyyy-MM-dd')}">2026-02-27</td>
				</tr>
				</tbody>
			</table>
		</section>
	</main>
</div>
</body>
</html>
