<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>홈 - Spring Form</title>
	<link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<div class="page">
	<header class="header">
		<div class="logo">Spring Form</div>
		<nav class="nav">
			<a th:href="@{/}">홈</a>
			<a th:href="@{/notices}">공지사항</a>
		</nav>
		<div class="auth">
			<div th:if="${loginUser != null}" class="user">안녕하세요, <span th:text="${loginUser.displayName}">사용자</span></div>
			<form th:if="${loginUser != null}" th:action="@{/logout}" method="post">
				<button class="btn" type="submit">로그아웃</button>
			</form>
			<div th:if="${loginUser == null}" class="auth-links">
				<a class="btn" th:href="@{/login}">로그인</a>
				<a class="btn btn-outline" th:href="@{/signup}">회원가입</a>
			</div>
		</div>
	</header>

	<main class="content">
		<section class="card">
			<h1>고객 포털</h1>
			<p>간단하고 단정한 UI로 구성된 샘플 사이트입니다.</p>
			<div class="actions">
				<a class="btn" th:href="@{/notices}">공지사항 보기</a>
				<a class="btn btn-outline" th:href="@{/signup}">회원가입</a>
			</div>
		</section>
	</main>
</div>
</body>
</html>
